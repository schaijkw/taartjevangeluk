{% assign feed = site.data.instagram_feed %}
<div class="instagram-feed">
  {% for post in feed.data %}
    <a href="{{ post.permalink }}" target="_blank">
      <img src="{{ post.media_url }}" alt="{{ post.caption | escape }}" />
    </a>
  {% endfor %}
</div>
