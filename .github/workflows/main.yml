name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC
  workflow_dispatch: # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
                    
      - name: Refresh Instagram Token & save media
        run: |
          # Refresh the long-lived token (do not log the token itself)
          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.INSTAGRAM_TOKEN }}")
          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
      
          # Check if token is empty
          if [ -z "$NEW_TOKEN" ] || [ "$NEW_TOKEN" = "null" ]; then
            echo "Token refresh failed!"
            exit 1
          fi
      
          echo "Token refreshed successfully."
      
          # Start paging loop
          NEXT_URL="https://graph.instagram.com/me/media?fields=id,caption,media_url,permalink,media_type&access_token=$NEW_TOKEN"
          ALL_MEDIA='{"data":[]}'
          
          while [ -n "$NEXT_URL" ]; do
            echo "Fetching page..."
            RESPONSE=$(curl -s "$NEXT_URL")
      
            # Extract only IMAGE posts and add tags array
            IMAGES=$(echo "$RESPONSE" | jq '{data: [.data[] 
              | select(.media_type=="IMAGE") 
              | . + {tags: ((.caption // "" | scan("#[A-Za-z0-9_]+")))} ]}')
      
            # Merge into ALL_MEDIA
            ALL_MEDIA=$(jq -s '{data: (.[0].data + .[1].data)}' \
              <(echo "$ALL_MEDIA") <(echo "$IMAGES"))
      
            # Get next page URL
            NEXT_URL=$(echo "$RESPONSE" | jq -r '.paging.next // empty')
          done
      
          # Save final feed JSON with deduplication by id
          echo "$ALL_MEDIA" | jq '{data: [.data | unique_by(.id)]}' > _data/instagram_feed.json
          echo "Instagram feed saved with all pages (deduplicated)."
      
      - name: Commit feed file
        uses: EndBug/add-and-commit@v9
        with:
          add: '_data/instagram_feed.json'
          message: 'Update Instagram feed'
          default_author: github_actions
