name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC
  workflow_dispatch: # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
                    
      - name: Refresh Instagram Token & save media
        run: |
          # Refresh the long-lived token (do not log the token itself)
          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.INSTAGRAM_TOKEN }}")
          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
      
          # Check if token is empty
          if [ -z "$NEW_TOKEN" ] || [ "$NEW_TOKEN" = "null" ]; then
            echo "Token refresh failed!"
            exit 1
          fi
          echo "Token refreshed successfully."
      
          NEXT_URL="https://graph.instagram.com/me/media?fields=id,caption,media_url,permalink,media_type,timestamp&access_token=$NEW_TOKEN"
          ALL_MEDIA='[]'
          
          while [ -n "$NEXT_URL" ]; do
            echo "Fetching page..."
            RESPONSE=$(curl -s "$NEXT_URL")
      
            # Extract only IMAGE posts, add tags array, keep timestamp
            IMAGES=$(echo "$RESPONSE" | jq '[.data[] 
              | select(.media_type=="IMAGE") 
              | . + {tags: ((.caption // "" | scan("#[A-Za-z0-9_]+")))} ]')
      
            # Merge arrays directly
            ALL_MEDIA=$(jq -s '.[0] + .[1]' <(echo "$ALL_MEDIA") <(echo "$IMAGES"))
      
            # Get next page URL
            NEXT_URL=$(echo "$RESPONSE" | jq -r '.paging.next // empty')
          done
      
          # Deduplicate by id and sort by timestamp descending
          echo "$ALL_MEDIA" \
            | jq '{data: (unique_by(.id) | sort_by(.timestamp) | reverse)}' \
            > _data/instagram_feed.json
      
          echo "Instagram feed saved with all pages (deduplicated, ordered by date)."
      
      - name: Commit feed file
        uses: EndBug/add-and-commit@v9
        with:
          add: '_data/instagram_feed.json'
          message: 'Update Instagram feed'
          default_author: github_actions
