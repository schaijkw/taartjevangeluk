name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC
  workflow_dispatch: # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Refresh Instagram Token & save media
        run: |
          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.INSTAGRAM_TOKEN }}")
          echo "Response: $RESPONSE"
          NEW_TOKEN=$(echo $RESPONSE | jq -r '.access_token')

          # Fetch feed using refreshed token
          MEDIA=$(curl -s "https://graph.instagram.com/me/media?fields=id,caption,media_url,permalink&access_token=$NEW_TOKEN") | jq '.' 
          echo $MEDIA > _data/instagram_feed.json
                   
      - name: Commit feed file
        uses: EndBug/add-and-commit@v9
        with:
          add: '_data/instagram_feed.json'
          message: 'Update Instagram feed'
          default_author: github_actions
